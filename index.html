<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>ba-meteo-app⚡</title>
</head>

<body>
    <div class="container">

        <header>
            <form>
                <input type="search" placeholder="enter a city..." required class="form-search-bar" />
                <input type="submit" value="Search" class="form-search-button" />
            </form>
        </header>

        <main>
            <div>
                <h1>Milan</h1>
                <p> Monday 18:38, sunny
                    <br />
                    Humidity: 50%, Wind: 10 km/h
                </p>
            </div>
            <div>☀ 36°C</div>
        </main>

        <footer>
            Coded by <a href="https://github.com/barbara-deforest" target="_blank">Barbara</a>,
            open-sourced on <a href="https://github.com/barbara-deforest/ba-meteo" target="_blank">Github</a>,
            hosted on <a href="https://www.netlify.com" target="_blank">Netlify</a>
        </footer>
    </div>
</body>

</html>
